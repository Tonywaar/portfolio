    <style id="splash-screen-style">
        html {
          height: 100%
        }

        body {
          margin: 0;
          min-height: 100%;
          background-color: #a3a3a3;
              background-size: 100% 100%;
        }

        .center {
          margin: 0;
          position: absolute;
          top: 50%;
          left: 50%;
          -ms-transform: translate(-50%, -50%);
          transform: translate(-50%, -50%);
        }

        .contain {
          display:block;
          width:100%; height:100%;
          object-fit: contain;
        }

        .stretch {
          display:block;
          width:100%; height:100%;
        }

        .cover {
          display:block;
          width:100%; height:100%;
          object-fit: cover;
        }

        .bottom {
          position: absolute;
          bottom: 0;
          left: 50%;
          -ms-transform: translate(-50%, 0);
          transform: translate(-50%, 0);
        }

        .bottomLeft {
          position: absolute;
          bottom: 0;
          left: 0;
        }

        .bottomRight {
          position: absolute;
          bottom: 0;
          right: 0;
        }

        @media (prefers-color-scheme: dark) {
          body {
            background-color: #121212;
              }
        }

<!--  body {-->
<!--    cursor: none; /* hide default cursor */-->
<!--  }-->

  .circle {
    position: fixed;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    background-color: #952b2b80;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
  }

  @media (hover: none) and (pointer: coarse) {
    #cursor-trail {
      display: none;
    }
  }
    </style>
    <script id="splash-screen-script">
        function removeSplashFromWeb() {
          document.getElementById("splash")?.remove();
          document.getElementById("splash-branding")?.remove();
          document.body.style.background = "transparent";
        }

<body>
<picture id="splash">
    <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x"
            media="(prefers-color-scheme: light)">
    <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x"
            media="(prefers-color-scheme: dark)">
    <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
</picture>

<div id="cursor-trail"></div>

<script src="flutter_bootstrap.js" async=""></script>
<!--    const cursor = document.querySelector('.custom-cursor');-->

<!--    document.addEventListener('mousemove', e => {-->
<!--      cursor.style.left = e.clientX + 'px';-->
<!--      cursor.style.top = e.clientY + 'px';-->
<!--    });-->
<script>
    const coords = { x: 0, y: 0 };
    const trailContainer = document.getElementById("cursor-trail");
    const numberOfCircles = 20;
    const circles = [];

    // Create circles dynamically
    for (let i = 0; i < numberOfCircles; i++) {
      const circle = document.createElement("div");
      circle.classList.add("circle");
      trailContainer.appendChild(circle);
      circle.x = 0;
      circle.y = 0;
      circles.push(circle);
    }

    window.addEventListener("mousemove", (e) => {
      coords.x = e.clientX;
      coords.y = e.clientY;
    });

    function animateCircles() {
      let x = coords.x;
      let y = coords.y;

      circles.forEach((circle, index) => {
        circle.style.left = x - 12 + "px";
        circle.style.top = y - 12 + "px";
        circle.style.transform = `scale(${(circles.length - index) / circles.length})`;

        circle.x = x;
        circle.y = y;

        const nextCircle = circles[index + 1] || circles[0];
        x += (nextCircle.x - x) * 0.3;
        y += (nextCircle.y - y) * 0.3;
      });

      requestAnimationFrame(animateCircles);
    }

    animateCircles();
</script>

</body>
